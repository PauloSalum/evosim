[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "evosim"
version = "0.1.0"
description = "Simulação de evolução de caminhada e corrida biológica em 3D"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []  # núcleo sem dependências (stdlib apenas)

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
pybullet = ["pybullet>=3.2"]
render = ["matplotlib>=3.6"]
all = ["PyYAML>=6.0", "pybullet>=3.2", "matplotlib>=3.6"]

[project.scripts]
evosim = "evosim.cli:main"

[tool.setuptools.packages.find]
include = ["evosim*"]

[tool.setuptools.package-data]
"evosim.web" = ["static/*"]
